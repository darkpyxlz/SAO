name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/engine.js js/quiz.js js/quests.js js/pics.js js/sky.js js/ui.js scripts/build-data.mjs; do node --check "$f"; done
      - name: Engine tests (data integrity, economy, events, saves)
        run: npm test

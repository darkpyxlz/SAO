name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/corp.js js/astro-a.js js/astro-b.js js/astro-c.js js/astro.js js/engine.js js/quiz.js js/quests.js js/pics.js js/figs.js js/figs-orbits.js js/figs-stars.js js/yearsky.js js/territory.js js/sky.js js/ui.js scripts/build-data.mjs; do node --check "$f"; done
      - name: Tests (data integrity, economy, events, saves, the Olympiad Academy)
        run: npm test
